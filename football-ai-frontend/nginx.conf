# ============================================================
# nginx config — Football AI Frontend
# ============================================================
# Bu nginx serveri 80 portda eshitadi (Docker'da 8088 portga map qilingan).
# /api so'rovlarini Spring Boot backend (port 8060) ga proxy qiladi.
# Boshqa hamma URL'lar React SPA'ga yo'naltiriladi (history mode).
# ============================================================

server {
    listen 80;
    server_name _;

    # Maksimum upload hajmi (video uchun 3GB gacha)
    client_max_body_size 3G;

    # Timeout'lar - katta video upload uchun
    client_body_timeout 3600s;       # 1 soat
    client_header_timeout 60s;
    send_timeout 3600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Buffer'lar
    proxy_buffering off;             # Streaming uchun (SSE)
    proxy_request_buffering off;     # Katta upload'lar uchun

    # Static fayllar (React build)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Asset'lar uchun uzoq muddatli cache
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — Spring Boot backend (Docker tarmog'i ichida)
    location /api/ {
        # docker-compose tarmog'idagi 'backend' service'iga yo'naltiramiz
        proxy_pass http://backend:8060/api/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streaming uchun
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA fallback — boshqa hamma yo'l index.html'ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoint (Docker healthcheck uchun)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
